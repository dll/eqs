version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eqs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eqs
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/server/migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.0
    container_name: eqs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: eqs-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: eqs-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: eqs
      REDIS_ADDR: redis:6379
      JWT_SECRET: eqs-secret-key
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:
  minio_data:
