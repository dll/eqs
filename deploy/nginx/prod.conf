server {
    listen 80;
    server_name eqs-chzu.tech;   # 主入口

    # 管理后台
    location /admin {
        alias /opt/eqs/packages/admin/dist;
        try_files $uri $uri/ /admin/index.html;
    }

    # 客户端H5
    location /h5 {
        alias /opt/eqs/packages/client/dist/build/h5;
        try_files $uri $uri/ /h5/index.html;
    }

    # API代理
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8080/api/v1/health;
    }

    # SSL配置（生产环境）
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/ssl/eqs.crt;
    # ssl_certificate_key /etc/nginx/ssl/eqs.key;
}
