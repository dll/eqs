# ===== EQS Caddy 接入片段 =====
# 服务器使用 Caddy（wxx 已占用 80/443），EQS 复用 Caddy 自动 HTTPS，
# 将 eqs-chzu.tech 转发到 nginx:8091，由 nginx 按路径分发 /admin /h5 /api。
#
# 用法：追加到服务器 /etc/caddy/Caddyfile 末尾，然后 `systemctl reload caddy`
#
# 前置条件：DNS A 记录已生效（eqs-chzu.tech 与 www.eqs-chzu.tech → 129.211.223.113）

eqs-chzu.tech {
	# 转发到 nginx（8091）——nginx 负责 /admin /h5 /api 路径分发
	reverse_proxy 127.0.0.1:8091

	# 安全头
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
	}

	log {
		output file /var/log/caddy/eqs.log
		format json
	}
}

www.eqs-chzu.tech {
	redir https://eqs-chzu.tech{uri} permanent
}
