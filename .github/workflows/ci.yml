name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint admin
        run: pnpm --filter @eqs/admin lint

  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build admin
        run: pnpm --filter @eqs/admin build

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: packages/admin/dist

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build client H5
        run: pnpm --filter @eqs/client build:h5

      - name: Build client mp-weixin
        run: pnpm --filter @eqs/client build:mp-weixin

      - name: Build client app resources
        run: pnpm --filter @eqs/client build:app

      - name: Upload mp-weixin
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-dist
          path: packages/client/dist/build/mp-weixin

      - name: Upload app resources
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: packages/client/dist/build/app

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download
        working-directory: packages/server

      - name: Build
        run: go build -o server cmd/server/main.go
        working-directory: packages/server

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...
        working-directory: packages/server

  test-client:
    name: Test Client (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run client tests
        run: pnpm --filter @eqs/client test

      - name: Type check client
        run: pnpm --filter @eqs/client lint

  test-admin:
    name: Test Admin (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run admin tests
        run: pnpm --filter @eqs/admin test

      - name: Type check admin
        run: pnpm --filter @eqs/admin lint
