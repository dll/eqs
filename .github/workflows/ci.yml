name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Lint admin
        run: pnpm --filter @eqs/admin lint

  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build admin
        run: pnpm --filter @eqs/admin build

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: packages/admin/dist

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build client H5
        run: pnpm --filter @eqs/client build:h5

      - name: Build client mp-weixin
        run: pnpm --filter @eqs/client build:mp-weixin

      - name: Build client app resources
        run: pnpm --filter @eqs/client build:app

      - name: Upload mp-weixin
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-dist
          path: packages/client/dist/build/mp-weixin

      - name: Upload app resources
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: packages/client/dist/build/app

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download
        working-directory: packages/server

      - name: Build
        run: go build -o server cmd/server/main.go
        working-directory: packages/server

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...
        working-directory: packages/server

      - name: Coverage gate (>= 60%)
        run: |
          go test ./... -coverprofile=cover.out > /dev/null
          total=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          echo "总覆盖率: ${total}%"
          threshold=60
          awk "BEGIN{exit !(${total} >= ${threshold})}" || { echo "覆盖率 ${total}% 低于门槛 ${threshold}%"; exit 1; }
          echo "覆盖率门禁通过"
        working-directory: packages/server

  test-client:
    name: Test Client (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run client tests
        run: pnpm --filter @eqs/client test

      - name: Type check client
        run: pnpm --filter @eqs/client lint

  test-admin:
    name: Test Admin (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run admin tests
        run: pnpm --filter @eqs/admin test

      - name: Type check admin
        run: pnpm --filter @eqs/admin lint


