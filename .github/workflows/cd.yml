name: CD - Deploy to Tencent Cloud

on:
  push:
    branches: [main]

jobs:
  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build admin
        run: pnpm --filter @eqs/admin build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: packages/admin/dist

  build-client:
    name: Build Client H5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build client H5
        run: pnpm --filter @eqs/client build:h5

      - name: Upload client H5
        uses: actions/upload-artifact@v4
        with:
          name: client-h5
          path: packages/client/dist/build/h5

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build server binary
        run: |
          CGO_ENABLED=1 go build -o server cmd/server/main.go
        working-directory: packages/server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: packages/server/server

  deploy-server:
    name: Deploy Server to CVM
    runs-on: ubuntu-latest
    needs: [build-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: server-binary

      - name: Upload binary via scp to temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          source: "server-binary/*"
          target: "/tmp/eqs-server-new"
          strip_components: 1

      - name: Atomic replace and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          script: |
            set -e
            chmod +x /tmp/eqs-server-new/server
            sudo systemctl stop eqs-server || true
            mv -f /tmp/eqs-server-new/server /opt/eqs/packages/server/server
            sudo systemctl start eqs-server
            sleep 3
            systemctl is-active eqs-server
            echo "EQS server deployed"

  deploy-admin:
    name: Deploy Admin to CVM Nginx
    runs-on: ubuntu-latest
    needs: [build-admin]
    steps:
      - name: Download admin dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist

      - name: Upload admin to nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          source: "admin-dist/*"
          target: "/opt/eqs/packages/admin/dist"
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          script: |
            sudo nginx -t && sudo nginx -s reload
            echo "Admin deployed to nginx"

  deploy-client:
    name: Deploy Client H5 to CVM Nginx
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      - name: Download client H5
        uses: actions/download-artifact@v4
        with:
          name: client-h5
          path: client-h5

      - name: Upload client H5 to nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          source: "client-h5/*"
          target: "/opt/eqs/packages/client/dist/build/h5"
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          script: |
            sudo nginx -t && sudo nginx -s reload
            echo "Client H5 deployed to nginx"




