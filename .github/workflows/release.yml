name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布的版本号（如 v1.0.0，仅在 workflow_dispatch 时使用）'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: eqs-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.22'

jobs:
  build-artifacts:
    name: Build all artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build server binary
        working-directory: packages/server
        run: |
          CGO_ENABLED=1 go build -o server cmd/server/main.go

      - name: Build admin
        run: pnpm --filter @eqs/admin build

      - name: Build client H5
        run: pnpm --filter @eqs/client build:h5

      - name: Build client mp-weixin
        run: pnpm --filter @eqs/client build:mp-weixin

      - name: Build client app resources
        run: pnpm --filter @eqs/client build:app

      - name: Assemble release files
        run: |
          mkdir -p release
          cp packages/server/server release/eqs-server
          cp -r packages/admin/dist release/admin-web
          cp -r packages/client/dist/build/h5 release/eqs-h5
          cp -r packages/client/dist/build/mp-weixin release/eqs-mp-weixin
          cp -r packages/client/dist/build/app release/eqs-app-resources

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EQS ${{ steps.tag.outputs.tag }}
          body: |
            ## EQS 发布 ${{ steps.tag.outputs.tag }}

            ### 产物
            - `eqs-server`：后端 Linux 二进制（CGO 静态，依赖 sqlite）
            - `admin-web/`：管理后台静态资源
            - `eqs-h5/`：用户端 H5 静态资源
            - `eqs-mp-weixin/`：微信小程序产物（微信开发者工具导入）
            - `eqs-app-resources/`：App 资源包（供 HBuilderX/离线 SDK 打包 APK/IPA）

            ### 使用方式
            1. 后端：`./eqs-server` 运行，配合 `deploy/systemd` 常驻
            2. H5/后台：静态托管到 COS / nginx
            3. 小程序：导入微信开发者工具上传体验版
            4. App：资源包导入 HBuilderX 云打包，或交给离线 SDK 工程自动出包
          files: |
            release/eqs-server
            release/admin-web/**/*
            release/eqs-h5/**/*
            release/eqs-mp-weixin/**/*
            release/eqs-app-resources/**/*
          draft: true
          generate_release_notes: true