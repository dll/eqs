name: iOS Build

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'iOS 版本类型'
        required: true
        default: 'init'
        type: choice
        options:
          - init
          - release

concurrency:
  group: eqs-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}

jobs:
  ios:
    name: Build iOS (${{ inputs.version_type }})
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build App resources
        run: pnpm --filter @eqs/client build:app

      - name: Upload App resources
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: packages/client/dist/build/app
          if-no-files-found: error

      - name: Fastlane - Sign and Export IPA
        if: hashFiles('apps/ios/**') != ''
        run: |
          if [ "${{ inputs.version_type }}" = "init" ]; then
            echo "${{ secrets.IOS_DEV_P12_BASE64 }}" | base64 -d > cert.p12
            echo "${{ secrets.IOS_DEV_PROVISION_BASE64 }}" | base64 -d > app.mobileprovision
            IPA_METHOD="ad-hoc"
          else
            echo "${{ secrets.IOS_DIST_P12_BASE64 }}" | base64 -d > cert.p12
            echo "${{ secrets.IOS_DIST_PROVISION_BASE64 }}" | base64 -d > app.mobileprovision
            IPA_METHOD="app-store"
          fi
          IPA_METHOD="$IPA_METHOD" \
          bundle exec fastlane build_ipa cert:cert.p12 provision:app.mobileprovision

      - name: Upload IPA
        if: hashFiles('apps/ios/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.version_type }}
          path: build/ipa/*.ipa
          if-no-files-found: warn

